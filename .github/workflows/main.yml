name: COBOL Check Automation
on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches: [main]
jobs:
  cobol-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: "11"
      - name: Zowe config
        run: |
          npx --package=@zowe/cli zowe profiles create zosmf-profile mi-perfil \
            --host "${{ secrets.ZOWE_HOST }}" \
            --port "${{ secrets.ZOWE_PORT }}" \
            --user "${{ secrets.MAINFRAME_USER }}" \
            --password "${{ secrets.MAINFRAME_PASSWORD }}" \
            --overwrite
      - name: Run COBOL Check
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
        run: |
          chmod +x .github/scripts/zowe_operations.sh
          .github/scripts/zowe_operations.sh
      - name: Run COBOL Check on Mainframe
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
        run: |
          chmod +x .github/scripts/mainframe_operations.sh
          .github/scripts/
